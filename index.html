<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy - Encuentra tu grupo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --sb-primary: #0B3954; --sb-accent: #087E8B; --sb-bg: #F7F7F2; }
    body { background-color: var(--sb-bg); }
    .btn-accent { background-color: var(--sb-accent); color: white; }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1>Grupos Disponibles</h1>
<!-- Modal de confirmación -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirmar inscripción</h5>
          </div>
          <div class="modal-body" id="confirmModalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-accent" id="confirmButton">Confirmar inscripción</button>
          </div>
        </div>
      </div>
    </div>

    <div id="grupos-list" class="row g-3"></div>
    <hr class="my-5">
    <h2>Consultar Inscripción</h2>
    <input type="text" id="folio-input" class="form-control" placeholder="Folio (SB-XXXXXX)">
    <button onclick="consultarFolio()" class="btn btn-accent mt-2">Consultar</button>
    <div id="resultado" class="mt-3"></div>

    <hr class="my-5">
    <h2>Asistente StudyBuddy</h2>
    <div class="mb-3">
      <input type="text" id="chat-question" class="form-control" placeholder="¿En qué puedo ayudarte?">
      <button onclick="preguntarChatbot()" class="btn btn-accent mt-2">Preguntar</button>
    </div>
    <div id="chat-respuesta" class="p-3 bg-white border rounded"></div>
  </div>
  <script>
    const grupos = [{ id: 1, name: 'Cálculo Avanzado' }, { id: 2, name: 'Programación Web' }];
    const list = document.getElementById('grupos-list');
    grupos.forEach(g => {
      list.innerHTML += `<div class="col-md-4"><div class="card p-3"><h5>${g.name}</h5>
        <button class="btn btn-accent" onclick="inscribirse(${g.id}, '${g.name}')">Unirme</button></div></div>`;
    });
    async function inscribirse(id, name) {
      const nombre = prompt('Tu nombre:');
      const email = prompt('Tu correo:');
      if (!nombre || !email) return;

      const modalBody = document.getElementById('confirmModalBody');
      modalBody.innerHTML = `<p><strong>Grupo:</strong> ${name}</p>
                             <p><strong>Nombre:</strong> ${nombre}</p>
                             <p><strong>Correo:</strong> ${email}</p>`;

      const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
      modal.show();

      document.getElementById('confirmButton').onclick = async () => {
        modal.hide();
        const res = await fetch('/api/register_group', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ group_id: id, group_name: name, student_name: nombre, student_email: email })
        });
        const data = await res.json();
        alert(data.folio ? 'Inscripción exitosa! Folio: ' + data.folio + '\nEstado: ' + data.status : 'Error: ' + data.error);
      };
    }
    async function consultarFolio() {
      const folio = document.getElementById('folio-input').value;
      const res = await fetch('/api/check_registration?folio=' + encodeURIComponent(folio));
      const data = await res.json();
      document.getElementById('resultado').innerHTML = data.folio ? `Grupo: ${data.group_name} | Estado: ${data.status}` : 'No encontrado';
    }

    async function preguntarChatbot() {
      const question = document.getElementById('chat-question').value;
      const respArea = document.getElementById('chat-respuesta');
      if (!question.trim()) return;
      respArea.innerText = 'Pensando...';
      try {
        const res = await fetch('/api/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        respArea.innerText = data.answer || data.error || 'Error desconocido';
      } catch (e) {
        respArea.innerText = 'Error al conectar con el asistente.';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
